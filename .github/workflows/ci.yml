name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', LICENSE, NOTICE]
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', LICENSE, NOTICE]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
